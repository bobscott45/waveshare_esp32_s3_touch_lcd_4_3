## IDF Component Manager Manifest File
version: "1.0.7"
targets:
  - esp32s3
description: "Driver for Waveshare ESP32 S3 Touch LCD 4.3 with GT911 touch and LVGL v8/v9 support"
url: "https://www.waveshare.com/esp32-s3-touch-lcd-4.3.htm"
repository: "https://github.com/bobscott45/waveshare_esp32_s3_touch_lcd_4_3"
license: "MIT"
dependencies:
  idf:
    version: '>=5.3.0'
  espressif/esp_lcd_touch: ^1.2.1
  espressif/esp_lcd_touch_gt911: ^1.2.0~2
  lvgl/lvgl: ">=8.3.11"
